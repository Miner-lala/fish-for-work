<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小鱼干打工记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* Layout: from 880px two columns. Left: the work clock and the day's timeline. Right: today's tally, the morning routine, the break timer, tasks and rewards. The attendance card spans the bottom. */
:root {
  color-scheme: light;
  --bg: #FFF8EF;
  --surface: #FFFFFF;
  --surface-2: #FFF3E4;
  --ink: #3B2F2A;
  --muted: #7E6F63;
  --line: #F0E3D1;
  --accent: #F29A4A;
  --accent-deep: #D77B2C;
  --on-accent: #3A1F06;
  --accent-soft: #FFEBD6;
  --accent-ink: #A2560F;
  --stamp: #E0564A;
  --on-stamp: #FFFFFF;
  --good: #A2560F;
  --work: #5B7FE0;
  --work-deep: #3F61C4;
  --on-work: #FFFFFF;
  --work-soft: #E6EDFF;
  --meal: #F4ECE1;
  --exercise: #F4ECE1;
  --rest: #F4ECE1;
  --other: #F4ECE1;
  --nonwork: #F4ECE1;
  --cat: #FFFFFF;
  --nose: #F4A3B4;
  --toast-bg: #3B2F2A;
  --toast-fg: #FFF8EF;
  --toast-action: #F7B06E;
  --font-display: "ZCOOL QingKe HuangYou", "PingFang SC", "Hiragino Sans GB", sans-serif;
  --font-body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --font-num: ui-rounded, "SF Pro Rounded", "PingFang SC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #221C19; --surface: #2E2723; --surface-2: #372F2A; --ink: #F3E9DF; --muted: #B5A79A; --line: #463B34;
    --accent: #F5A963; --accent-deep: #C47D3A; --on-accent: #2A1606; --accent-soft: #4A3220; --accent-ink: #FFC48C;
    --stamp: #F2857A; --on-stamp: #2A0B07; --good: #FFC48C;
    --work: #7F9CF0; --work-deep: #5674CC; --on-work: #0E1633; --work-soft: #2C3552;
    --meal: #3A312B; --exercise: #3A312B; --rest: #3A312B; --other: #3A312B; --nonwork: #3A312B;
    --cat: #F3E9DF; --nose: #F4A3B4;
    --toast-bg: #F3E9DF; --toast-fg: #221C19; --toast-action: #A2560F;
  }
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 4vw, 40px); line-height: 1.05; letter-spacing: 0.03em; }
h2 { font-size: 17px; font-weight: 650; line-height: 1.3; }
h3 { font-size: 14px; font-weight: 650; color: var(--muted); }
.eyebrow { font-size: 12px; letter-spacing: 0.14em; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.pos { color: var(--good); }
.neg { color: var(--stamp); }

.app { max-width: 1240px; margin: 0 auto; padding: 20px 20px 110px; display: flex; flex-direction: column; gap: 16px; }

/* header + employee badge */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; }
.brand { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.date { color: var(--muted); font-size: 14px; }
.badge { position: relative; flex: 1 1 300px; max-width: 400px; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 3px 14px; padding: 24px 16px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.badge::before { content: ""; position: absolute; top: 9px; left: 50%; width: 40px; height: 7px; transform: translateX(-50%); border-radius: 4px; background: var(--bg); border: 1px solid var(--line); }
.avatar { grid-row: span 3; width: 52px; height: 48px; }
.avatar .head { fill: var(--cat); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
.avatar .ear { fill: var(--nose); opacity: .5; }
.avatar .eye { fill: var(--ink); }
.avatar .nose { fill: var(--nose); }
.avatar .mouth { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; }
.avatar .whisker { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-linecap: round; }
.rank { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.rank-name { font-family: var(--font-display); font-size: 24px; line-height: 1.1; }
.rank-lv { font-size: 13px; color: var(--muted); }
.rank-meta { font-size: 13px; color: var(--muted); }
.rank-bar { height: 6px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.rank-bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .4s ease; }

.cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (min-width: 880px) { .cols { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.stack.tight { gap: 4px; }
.sub-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

/* buttons */
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 9px 18px; border-radius: 10px; border: 1px solid transparent; font-weight: 650; cursor: pointer; text-align: center; }
.btn:focus-visible, .linkbtn:focus-visible, .toast button:focus-visible, .seg button:focus-visible, .slot:focus-visible, .mc:focus-visible { outline: 3px solid var(--work); outline-offset: 2px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn.mini { min-height: 34px; padding: 5px 12px; font-size: 14px; font-weight: 600; }
.btn.earn { min-width: 78px; padding: 7px 12px; background: var(--accent-soft); color: var(--accent-ink); font-family: var(--font-num); font-weight: 500; }
.btn.buy { min-width: 88px; padding: 7px 12px; background: var(--ink); color: var(--surface); }
.btn.buy:disabled { background: var(--surface-2); color: var(--muted); border-color: var(--line); opacity: 1; font-weight: 500; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.fish { width: 18px; height: 11px; flex: none; }
.linkbtn { appearance: none; background: none; border: 0; padding: 6px 4px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 13px; }
.linkbtn.danger { color: var(--stamp); }
.linkbtn:disabled { opacity: .4; cursor: default; text-decoration: none; }

/* work clock */
.clock-card { gap: 14px; }
.clock-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; }
.wk-big { font-size: clamp(44px, 5.2vw, 60px); font-weight: 500; line-height: 1; letter-spacing: -0.01em; }
.wk-big.is-late { color: var(--stamp); }
.wk-big.is-working { color: var(--work); }
.btn-work { appearance: none; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 80px; border: 0; border-radius: 16px; background: var(--accent); color: var(--on-accent); font-size: 26px; font-weight: 750; letter-spacing: 0.14em; cursor: pointer; box-shadow: 0 6px 0 var(--accent-deep); transition: transform .08s ease, box-shadow .08s ease; }
.btn-work:hover { filter: brightness(1.04); }
.btn-work:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--accent-deep); }
.btn-work.is-working { background: var(--work); color: var(--on-work); box-shadow: 0 6px 0 var(--work-deep); }
.btn-work.is-working:active { box-shadow: 0 2px 0 var(--work-deep); }
.btn-work:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
.chips-s { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-s { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-size: 12px; color: var(--muted); white-space: nowrap; }
.chip-s.good { color: var(--good); border-color: var(--good); background: transparent; }
.chip-s.bad { color: var(--stamp); border-color: var(--stamp); background: transparent; }
.chip-s.live { color: var(--work); border-color: var(--work); background: transparent; }
.wk-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.rules-btn { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.rules-btn[aria-expanded="true"] { color: var(--ink); }
.qmark { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid currentColor; font-size: 11px; font-weight: 700; line-height: 1; }
.rules-pop { border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); padding: 12px 14px; font-size: 14px; display: flex; flex-direction: column; gap: 8px; }
.rules-pop ol { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 4px; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.confetti i { position: absolute; display: block; }

/* timeline */
.tl-card { gap: 10px; }
.tl-nav { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tl-scroll { position: relative; height: 600px; overflow-y: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
@media (max-width: 879px) { .tl-scroll { height: 480px; } }
.tl-scroll:focus-visible { outline: 3px solid var(--work); outline-offset: 2px; }
.tl-heads { position: sticky; top: 0; z-index: 6; display: grid; grid-template-columns: 60px minmax(0, 1fr) 34%; padding: 6px 0; background: var(--surface); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); text-align: center; }
.tl { position: relative; margin: 14px 0 18px; }
.tl-hour { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
.tl-hour span { position: absolute; left: 8px; top: -9px; padding: 0 4px; background: var(--surface); font-size: 12px; color: var(--muted); line-height: 16px; }
.tl-half { position: absolute; left: 60px; right: 0; border-top: 1px dashed var(--line); opacity: .6; }
.tl-plan { position: absolute; left: 60px; right: calc(34% + 6px); display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 6px 10px; border-radius: 10px; overflow: hidden; color: var(--ink); }
.tl-plan.t-work { background: var(--work-soft); box-shadow: inset 4px 0 0 var(--work); }
.tl-plan.t-meal, .tl-plan.t-exercise, .tl-plan.t-rest, .tl-plan.t-other { background: var(--nonwork); }
.tl-plan.is-now { box-shadow: inset 0 0 0 2px var(--ink); }
.tl-plan.t-work.is-now { background: var(--work); color: var(--on-work); box-shadow: 0 6px 18px rgba(42, 85, 200, .3); }
.tl-plan.is-off { opacity: .45; }
.pn { font-weight: 650; font-size: 14px; line-height: 1.25; }
.pt { font-size: 12px; opacity: .8; line-height: 1.2; }
.tl-plan .chip-s { background: var(--surface); }
.tl-plan.t-work.is-now .chip-s { background: transparent; color: var(--on-work); border-color: var(--on-work); }
.tl-act { position: absolute; right: 8px; width: calc(34% - 14px); border-radius: 6px; overflow: hidden; }
.tl-act.a-work { background: var(--work); }
.tl-act.a-open { background: repeating-linear-gradient(180deg, var(--work) 0 8px, var(--work-deep) 8px 10px); }
.tl-act.a-play { background: var(--accent); }
.tl-act span { display: block; padding: 3px 6px; font-size: 11px; line-height: 1.3; color: var(--on-work); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-act.a-play span { color: var(--on-accent); }
.tl-tick { position: absolute; right: 8px; width: calc(34% - 14px); height: 0; border-top: 2px solid var(--good); }
.tl-tick span { position: absolute; left: 0; top: -8px; max-width: 100%; padding: 0 4px; border-radius: 4px; background: var(--surface); color: var(--good); font-size: 11px; line-height: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-now { position: absolute; left: 54px; right: 0; height: 0; border-top: 2px solid var(--stamp); z-index: 5; pointer-events: none; }
.tl-now::before { content: ""; position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--stamp); }
.tl-now span { position: absolute; right: 6px; top: -21px; padding: 1px 6px; border-radius: 6px; background: var(--stamp); color: var(--on-stamp); font-size: 11px; line-height: 16px; }
.tl-empty { position: absolute; left: 70px; right: calc(34% + 6px); top: 24px; color: var(--muted); font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key { display: inline-block; width: 14px; height: 10px; border-radius: 2px; }
.k-work { background: var(--work-soft); box-shadow: inset 3px 0 0 var(--work); }
.k-off { background: var(--nonwork); }
.k-done { background: var(--work); }
.k-play { background: var(--accent); }
.k-tick { height: 0; border-top: 2px solid var(--good); border-radius: 0; }
.k-now { height: 0; border-top: 2px solid var(--stamp); border-radius: 0; }
.legend .seal { width: 16px; height: 16px; color: var(--stamp); }
.legend .dash { width: 18px; border-top: 1.5px dashed var(--muted); }

/* today */
.today { flex-direction: row; flex-wrap: wrap; align-items: stretch; justify-content: space-between; gap: 16px; }
.today-main { flex: 1 1 220px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.big { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.big > .num { font-size: 46px; font-weight: 500; line-height: 1; }
.big .of { color: var(--muted); font-size: 15px; }
.meter { height: 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s ease; }
.meter.met i { background: var(--good); }
.streak { font-size: 14px; }
.wallet { flex: 0 1 auto; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; gap: 2px; padding: 12px 16px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-ink); min-width: 128px; }
.wallet .eyebrow { color: inherit; }
.wallet-num { font-size: 34px; font-weight: 500; line-height: 1.05; display: inline-flex; align-items: center; gap: 8px; }
.wallet-num .fish { width: 24px; height: 14px; }
.wallet-unit { font-size: 13px; }

/* morning */
.morning-steps { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 4px; }
.morning.done { background: var(--surface-2); }

/* break timer */
.rest { background: var(--accent-soft); border-color: transparent; }
.clock { font-size: clamp(48px, 6vw, 72px); font-weight: 500; line-height: 1; letter-spacing: -0.02em; }
.track { height: 6px; border-radius: 999px; background: var(--surface); overflow: hidden; }
.clock.is-over { color: var(--stamp); }
.wk-stop { margin-top: -4px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; font-size: 13px; }
.wk-stop-form { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.input.time-in { width: auto; min-width: 0; padding: 4px 8px; min-height: 32px; font-family: var(--font-num); }
.leave-pop { border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.leave-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.leave-line { display: grid; grid-template-columns: 3.2em minmax(0, 1fr); align-items: center; gap: 8px; }
.leave-k { font-size: 12px; color: var(--muted); }
.leave-hours { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.leave-hours select { width: auto; min-height: 32px; padding: 4px 8px; }
.pill { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
.pill.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.leave-msg { color: var(--muted); }
.leave-msg.warn { color: var(--stamp); }
.leave-list ul { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; }
.leave-item { display: grid; grid-template-columns: minmax(0, 1fr) auto 3em; gap: 10px; align-items: center; padding: 5px 0; border-top: 1px solid var(--line); font-size: 13px; }
.sess-tag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 999px; font-size: 11px; line-height: 17px; background: var(--surface-2); color: var(--muted); font-family: inherit; }
.sess-tag.warn { background: #FCE9C8; color: #8A5300; }
.dd-acts { display: inline-flex; gap: 10px; justify-self: end; white-space: nowrap; }
.list.dd .row.sess-edit { align-items: center; background: var(--surface-2); border-radius: 8px; padding: 8px 6px; }
.sess-edit-f { display: inline-flex; align-items: center; gap: 4px; }
.list.dd .row.ot .dd-t, .list.dd .row.ot span { color: var(--muted); font-size: 13px; }
.list.dd .row.ot-sum { border-top: 1px dashed var(--line); }
.dd-trash { border-top: 1px dashed var(--line); padding-top: 4px; }
.away-note { border: 1px solid var(--accent); border-radius: 12px; background: var(--accent-soft); color: var(--accent-ink); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.away-note .btn-row { gap: 14px; }
.dd-trash .trash-head { font-size: 12px; color: var(--muted); padding: 6px 0 2px; }
.list.dd .row.trash-row { color: var(--muted); }
.list.dd .row.leave-row .dd-l { color: var(--muted); }
.tl-plan.tl-leave { z-index: 2; background: repeating-linear-gradient(135deg, var(--surface) 0 6px, var(--nonwork) 6px 12px) !important; border: 1.5px dashed var(--muted) !important; color: var(--muted) !important; box-shadow: none !important; }
.track i { display: block; height: 100%; width: 0; background: var(--accent); }

/* lists */
.list { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.row.two { grid-template-columns: minmax(0, 1fr) auto; }
.row:first-child { border-top: 0; padding-top: 2px; }
.row-name { font-weight: 600; }
.row-note, .row-meta { display: block; font-size: 13px; color: var(--muted); }
.row-meta { font-size: 12px; }
.row.is-done .row-name { color: var(--muted); }
.row-count { font-size: 13px; color: var(--muted); min-width: 2.2em; text-align: right; }
.check { font-size: 13px; color: var(--good); white-space: nowrap; }
.price { display: inline-flex; align-items: center; gap: 5px; font-size: 15px; color: var(--accent-ink); }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
.log .row { grid-template-columns: auto minmax(0, 1fr) auto auto; font-size: 14px; }
.log .t { color: var(--muted); font-size: 13px; }
.amt { font-size: 14px; }
.att .row { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto; font-size: 14px; }
.att .total { font-weight: 650; }

/* editors */
.editor { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.editor:focus { outline: none; }
.form-error { padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--stamp); background: var(--surface); }
.ed-group { margin: 0; border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ed-group legend { padding: 0 6px; font-size: 13px; font-weight: 650; color: var(--muted); }
.ed-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.ed-item { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--surface-2); min-width: 0; }
.ed-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.sched-row { display: grid; grid-template-columns: minmax(0, 1.4fr) 92px 92px minmax(0, 1fr); gap: 10px; align-items: end; }
@media (max-width: 620px) { .sched-row { grid-template-columns: 1fr 1fr; } }
.rules-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.grow { flex: 1 1 160px; }
.field.narrow { flex: 0 0 96px; }
.field.goal { max-width: 200px; }
.field-label { font-size: 12px; color: var(--muted); }
.input { appearance: none; width: 100%; min-height: 40px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 15px; }
textarea.input { resize: vertical; line-height: 1.5; }
.input:focus-visible { outline: 3px solid var(--work); outline-offset: 1px; }
.input[aria-invalid="true"] { border-color: var(--stamp); }
.ed-lock { flex: 1 1 160px; font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { position: relative; display: inline-flex; }
.chip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chip span { display: inline-flex; align-items: center; justify-content: center; min-width: 46px; min-height: 36px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 600; cursor: pointer; }
.chip input:checked + span { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip input:focus-visible + span { outline: 3px solid var(--work); outline-offset: 2px; }
.ed-actions { display: flex; gap: 14px; justify-content: flex-end; }
.check-line { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.check-line input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.ed-list.compact { gap: 6px; }
.ed-line { display: flex; align-items: center; gap: 2px; padding-right: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); min-width: 0; }
.ed-li.is-open .ed-line { border-radius: 10px 10px 0 0; border-bottom-style: dashed; }
.ed-sum { appearance: none; flex: 1; min-width: 0; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto 48px; align-items: center; gap: 10px; min-height: 42px; padding: 6px 8px 6px 12px; background: none; border: 0; border-radius: 10px; text-align: left; color: inherit; cursor: pointer; }
.ed-sum:focus-visible, .ed-mv:focus-visible { outline: 3px solid var(--work); outline-offset: 1px; }
.ed-sum .chev { color: var(--muted); font-weight: 700; transition: transform .15s ease; }
.ed-sum[aria-expanded="true"] .chev { transform: rotate(90deg); }
.ed-sum .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ed-sum .nm.empty-name { color: var(--muted); font-weight: 500; }
.ed-sum .fq { font-size: 12px; color: var(--muted); white-space: nowrap; }
.ed-sum .fs { font-size: 13px; color: var(--accent-ink); text-align: right; }
.ed-handle { appearance: none; flex: none; width: 28px; height: 36px; margin-left: 2px; border: 0; border-radius: 8px; background: none; color: var(--muted); font-size: 16px; line-height: 1; cursor: grab; touch-action: none; }
.ed-handle:hover { background: var(--line); color: var(--ink); }
.ed-handle:focus-visible { outline: 3px solid var(--work); outline-offset: 1px; }
.ed-li.drop-before > .ed-line, .ed-li.drop-before > .ed-empty { box-shadow: 0 -4px 0 -1px var(--work); }
.ed-list.drop-end::after { content: ""; display: block; height: 3px; border-radius: 2px; background: var(--work); }
.ed-empty { border: 1px dashed var(--line); border-radius: 10px; padding: 9px 12px; color: var(--muted); font-size: 13px; text-align: center; }
.is-dragging { opacity: .35; }
.drag-ghost { position: fixed; z-index: 70; margin: 0; list-style: none; pointer-events: none; opacity: .95; background: var(--surface); border-radius: 10px; box-shadow: 0 10px 28px rgba(10, 16, 28, .22); }
body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }
.list li[data-drag-task] { cursor: grab; -webkit-user-select: none; user-select: none; }
.list.drop-ok { outline: 2px dashed var(--work); outline-offset: 4px; border-radius: 8px; background: var(--work-soft); }
.linkbtn.inline { padding: 0 2px; font-size: 12px; }
.row-meta .pick-tag { color: var(--work); }
/* day detail */
.dd-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap; }
.dd-head h3 { font-size: 16px; color: var(--ink); }
.dd-right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.dd-total { font-size: 20px; font-weight: 600; }
.dd-sec { display: flex; flex-direction: column; gap: 2px; }
.dd-sec h4 { margin: 6px 0 0; font-size: 12px; font-weight: 650; letter-spacing: .12em; color: var(--muted); }
.list.dd .row { grid-template-columns: 9.5em minmax(0, 1fr) 3.4em 2.6em; gap: 10px; padding: 8px 0; font-size: 14px; }
.list.dd .row:first-child { padding-top: 6px; }
.dd-l { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dd-l .tm { margin-left: 6px; font-weight: 400; color: var(--muted); font-family: var(--font-num); font-size: 13px; }
.dd-l.t { font-weight: 400; color: var(--muted); font-family: var(--font-num); font-size: 13px; }
.dd-amt { text-align: right; }
.dd-act { justify-self: end; }
.live { color: var(--work); font-weight: 600; }
.ed-mv { appearance: none; width: 30px; height: 30px; border: 0; border-radius: 8px; background: none; color: var(--muted); font-size: 15px; cursor: pointer; }
.ed-mv:hover:not(:disabled) { background: var(--line); color: var(--ink); }
.ed-mv:disabled { opacity: .25; cursor: default; }
.ed-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 10px 10px; background: var(--surface-2); min-width: 0; }
.ed-gtitle { margin-top: 4px; }
.ed-foot { position: sticky; bottom: 0; z-index: 3; margin: 0 -18px -18px; padding: 12px 18px; background: var(--surface); border-top: 1px solid var(--line); border-radius: 0 0 14px 14px; }

/* attendance card */
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button { appearance: none; border: 0; background: transparent; min-height: 32px; padding: 5px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(10, 16, 28, .14); }
.att-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 880px) { .att-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
.timecard { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.slot { appearance: none; position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; padding: 8px 2px 10px; border: 1px dashed var(--line); border-radius: 10px; background: transparent; color: inherit; min-width: 0; cursor: pointer; }
.slot > span { display: block; }
.slot.is-today { border: 1.5px solid var(--ink); }
.slot.is-selected { background: var(--surface-2); }
.slot.is-future { opacity: .55; cursor: default; }
.wd { font-size: 13px; font-weight: 650; line-height: 1; }
.dd { font-size: 11px; color: var(--muted); line-height: 1; }
.bars { position: relative; width: 100%; height: 112px; }
.goal-line { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--muted); }
.bar { position: absolute; bottom: 0; left: 50%; width: 44%; max-width: 24px; transform: translateX(-50%); border-radius: 5px 5px 2px 2px; background: var(--accent); }
.val { font-size: 13px; line-height: 1; }
.stamp { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; transform: translate(-50%, -58%) rotate(-14deg); color: var(--stamp); opacity: .88; pointer-events: none; }
.month-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.month-title { font-weight: 650; }
.month-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.mh { font-size: 12px; color: var(--muted); text-align: center; }
.mc { appearance: none; position: relative; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; min-width: 0; aspect-ratio: 1 / 1; padding: 4px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); overflow: hidden; cursor: pointer; }
.mc.blank { border: 0; background: transparent; cursor: default; }
.mc.is-today { border: 1.5px solid var(--ink); }
.mc.is-selected { background: var(--accent-soft); border-color: var(--accent); }
.mc.is-future { opacity: .45; cursor: default; }
.mc-d { font-size: 12px; line-height: 1; }
.mc-v { align-self: flex-end; font-size: 11px; line-height: 1; color: var(--muted); }
.mc-v.neg { color: var(--stamp); }
.mc-stamp { position: absolute; left: 50%; top: 50%; width: 70%; height: 70%; transform: translate(-50%, -50%) rotate(-14deg); color: var(--stamp); opacity: .8; pointer-events: none; }

.foot { font-size: 12px; color: var(--muted); text-align: center; text-wrap: balance; }

.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-radius: 12px; background: var(--toast-bg); color: var(--toast-fg); box-shadow: 0 10px 30px rgba(10, 16, 28, .22); z-index: 30; }
.toast button { background: none; border: 0; padding: 6px 10px; color: var(--toast-action); font-weight: 700; cursor: pointer; flex: none; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
/* ---------- 方案 B: warm, round, quiet ---------- */
h1 { font-size: clamp(28px, 3.4vw, 36px); }
h2 { font-weight: 600; }
h3 { font-weight: 600; }
.card { border-radius: 20px; border-color: var(--line); padding: 18px 20px; }
.btn { border-radius: 999px; }
.btn.mini { font-weight: 500; }
.btn.ghost { border-color: var(--line); background: var(--surface); }
.btn.primary { box-shadow: 0 3px 0 var(--accent-deep); }
.linkbtn { text-decoration: none; }
.linkbtn:hover { color: var(--ink); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.top { align-items: center; }
.brand { flex-direction: row; align-items: center; gap: 14px; }
.mascot { width: 64px; height: 58px; flex: none; color: #3B2F2A; --cat: #FFFFFF; }
.mascot svg { width: 100%; height: 100%; overflow: visible; }
.date { font-size: 13px; }
.badge { position: relative; flex: 0 1 300px; display: flex; flex-direction: column; align-items: stretch; justify-content: center; gap: 8px; padding: 14px 16px; border-radius: 20px; }
.badge::before { display: none; }
.rank { flex-wrap: wrap; align-items: center; gap: 6px; }
.rank-name { font-size: 20px; }
.rank-meta { margin-left: auto; font-size: 13px; color: var(--muted); }
.rank-bar { height: 8px; border: 0; background: var(--surface-2); }
.rank-bar i { background: var(--accent); border-radius: 999px; }
.qbtn { appearance: none; border: 0; background: none; padding: 2px; color: var(--muted); cursor: pointer; display: inline-flex; border-radius: 50%; }
.qbtn:hover, .qbtn[aria-expanded="true"] { color: var(--ink); }
.qbtn:focus-visible { outline: 3px solid var(--work); outline-offset: 1px; }
.pop { position: absolute; z-index: 20; top: calc(100% + 8px); right: 0; width: min(300px, 86vw); padding: 12px 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); box-shadow: 0 10px 30px rgba(59, 47, 42, .14); font-size: 14px; }
.lv-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.lv-list li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
.lv-list li:first-child { border-top: 0; }
.lv-list .lv-n { font-size: 12px; color: var(--muted); }
.lv-list .is-cur { font-weight: 600; color: var(--accent-ink); }
.lv-list .is-done { color: var(--muted); }
.clock-card { gap: 12px; }
.wk-big { font-size: clamp(52px, 6vw, 68px); font-weight: 600; letter-spacing: 0; }
.wk-hint { color: var(--stamp); }
.btn-work { min-height: 68px; border-radius: 999px; font-size: 24px; font-weight: 700; box-shadow: 0 5px 0 var(--accent-deep); }
.wk-dots { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.wk-dot { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.wk-dot i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--line); }
.wk-dot.live i { border-color: var(--work); background: var(--work-soft); }
.wk-dot.good i { border-color: var(--work); background: var(--work); }
.wk-dot.bad i { border-color: var(--stamp); background: var(--stamp); }
.wk-dot b { font-weight: 500; color: var(--accent-ink); }
.wk-dot.bad b { color: var(--stamp); }
.today { display: block; }
.today-row { display: flex; align-items: center; gap: 16px; }
.today-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.big { align-items: baseline; gap: 8px; }
.big .eyebrow { margin-right: 4px; }
.big > .num { font-size: 36px; font-weight: 600; }
.big .of { font-size: 16px; }
.meter { height: 10px; border: 0; background: var(--surface-2); }
.meter i { border-radius: 999px; }
.meter.met i { background: var(--accent); }
.wallet { padding: 10px 16px; border-radius: 16px; min-width: 0; }
.wallet-num { font-size: 30px; font-weight: 600; }
.sub-head h3 { font-size: 13px; }
.sub-head .num { font-size: 13px; }
/* one-line task rows */
.trow { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto auto; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
.trow:first-child { border-top: 0; }
.trow .tname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .tsub { display: block; font-size: 12px; color: var(--muted); white-space: normal; }
.trow .tprog { font-size: 12px; color: var(--muted); margin-left: 6px; }
.trow .tag { font-size: 11px; color: var(--work); background: var(--work-soft); border-radius: 999px; padding: 1px 7px; margin-left: 6px; vertical-align: 1px; }
.trow.is-done .tname { color: var(--muted); }
.trow.is-done .pts { opacity: .5; }
.tick { appearance: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--accent); background: var(--surface); color: var(--on-accent); display: grid; place-items: center; padding: 0; cursor: pointer; font-size: 14px; line-height: 1; font-weight: 700; transition: transform .1s ease, background .15s ease; }
.tick:hover:not(:disabled) { background: var(--accent-soft); transform: scale(1.08); }
.tick:active:not(:disabled) { transform: scale(.92); }
.tick:focus-visible { outline: 3px solid var(--work); outline-offset: 2px; }
.tick.is-on { background: var(--accent); border-color: var(--accent); }
.tick.is-on:disabled { cursor: default; }
.tick.multi { border-style: dashed; }
.tick.multi.lv1 { background: #FFEBD6; border-color: #F29A4A; color: #A2560F; }
.tick.multi.lv2 { background: #FAC775; border-color: #E8892F; color: #633806; }
.tick.multi.lv3 { background: #F29A4A; border-color: #C9711F; color: #3A1F06; }
.tick.multi.lv4 { background: #C9711F; border-color: #8F4C0C; color: #FFFFFF; }
.tick.multi.lv5 { background: #8F4C0C; border-color: #633806; color: #FFFFFF; }
.pts { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-num); font-size: 14px; font-weight: 600; color: var(--accent-ink); white-space: nowrap; }
.pts .fish { width: 15px; height: 9px; }
.rowx { appearance: none; border: 0; background: none; color: var(--muted); cursor: pointer; width: 22px; height: 22px; border-radius: 50%; padding: 0; opacity: 0; }
.trow:hover .rowx, .rowx:focus-visible { opacity: 1; }
.rowx:hover { background: var(--surface-2); color: var(--ink); }
.trow.no-x { grid-template-columns: 26px minmax(0, 1fr) auto; }
/* shop rows */
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.srow:first-child { border-top: 0; }
.srow .tsub { display: block; font-size: 12px; color: var(--muted); }
.btn.buy { min-height: 34px; min-width: 64px; padding: 4px 14px; background: transparent; color: var(--accent-ink); border: 1.5px solid var(--accent); font-weight: 600; }
.btn.buy:hover:not(:disabled) { background: var(--accent); color: var(--on-accent); }
.short { font-size: 12px; color: var(--muted); min-width: 64px; text-align: center; white-space: nowrap; }
/* timeline / attendance tweaks */
.tl-scroll { border-radius: 16px; }
.tl-plan { border-radius: 12px; }
.tl-act { border-radius: 8px; }
.slot { border-radius: 14px; }
.bar { background: var(--accent); }
.mc { border-radius: 10px; }
.rest { border-radius: 20px; }
/* merged day detail */
.dd-head { align-items: baseline; }
.dd-total { font-size: 20px; font-weight: 600; }
.list.dd .row { grid-template-columns: 8.4em 9.6em minmax(0, 1fr) 3em 4.8em; gap: 8px; padding: 7px 0; font-size: 14px; }
.list.dd .row.sub { padding-top: 0; border-top: 0; }
.dd-rec { border-top: 1px dashed var(--line); padding-top: 4px; }
.dd-t { font-family: var(--font-num); font-size: 13px; color: var(--muted); white-space: nowrap; }
.dd-t.live, .live { color: var(--work); font-weight: 600; }
.dd-act { opacity: 0; }
.list.dd .row:hover .dd-act, .dd-act:focus-visible { opacity: 1; }
.dd-foot { justify-content: flex-end; }
/* timeline, one lane: plan blocks, a blue bar for real work on the left edge, task dots, a cat on the now line */
.tl { margin: 16px 0 18px; }
.tl-plan { left: 62px; right: 10px; padding: 8px 12px 8px 22px; border: 1.5px solid transparent; border-radius: 14px; }
.tl-plan.t-work { background: var(--work-soft); box-shadow: none; color: var(--ink); }
.tl-plan.t-work .pt { color: var(--work-deep); opacity: 1; }
.tl-plan.t-work.is-now { background: var(--work-soft); color: var(--ink); border-color: var(--work); box-shadow: 0 4px 16px rgba(91, 127, 224, .18); }
.tl-plan.t-work.is-now .chip-s { color: var(--work-deep); border-color: var(--work); background: var(--surface); }
.tl-plan.t-meal, .tl-plan.t-exercise, .tl-plan.t-rest, .tl-plan.t-other { background: transparent; border: 1.5px dashed var(--line); color: var(--muted); }
.tl-plan.t-meal .pn, .tl-plan.t-exercise .pn, .tl-plan.t-rest .pn, .tl-plan.t-other .pn { font-weight: 500; }
.tl-plan .chip-s { background: var(--surface); }
.tl-bar { position: absolute; left: 66px; width: 8px; border-radius: 4px; z-index: 2; }
.tl-bar.a-work { background: var(--work); }
.tl-bar.a-open { background: var(--work); animation: tl-breathe 2.4s ease-in-out infinite; }
.tl-bar.a-play { left: auto; right: 16px; background: var(--accent); }
.tl-bar.a-play.a-over { background: var(--stamp); }
@keyframes tl-breathe { 50% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) { .tl-bar.a-open { animation: none; } }
.tl-dot { position: absolute; right: 74px; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); z-index: 3; cursor: default; }
.tl-dot span { display: none; position: absolute; right: 20px; top: -4px; padding: 1px 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--accent-ink); font-size: 12px; line-height: 18px; white-space: nowrap; }
.tl-dot:hover span, .tl-dot:focus-visible span { display: block; }
.tl-dot:focus-visible { outline: 3px solid var(--work); outline-offset: 1px; }
.tl-now { left: 56px; border-top-width: 1.5px; }
.tl-now::before { display: none; }
.tl-now .tl-cat { position: absolute; left: -8px; right: auto; top: -12px; width: 22px; height: 22px; padding: 0; background: none; border-radius: 0; }
.tl-cat svg { width: 100%; height: 100%; display: block; }
.tl-nowt { right: 8px; top: -10px; padding: 1px 8px; border-radius: 999px; font-size: 11px; line-height: 17px; }
.tl-hour span { left: 6px; }
/* morning card */
.morning-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.morning-steps { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; }
.morning.done { padding-top: 12px; padding-bottom: 12px; background: var(--surface-2); }
.morning.done h2 { font-size: 15px; color: var(--muted); }
.morning.done .pts { opacity: .55; }
.morning-done { color: var(--accent-ink); }
/* level popover cats, bones, empty states, a bobbing working cat */
.lv-cat { width: 28px; height: 28px; display: block; color: #3B2F2A; --cat: #fff; }
.lv-cat svg { width: 100%; height: 100%; }
.stamp.bone, .mc-stamp.bone { color: var(--muted); opacity: .55; transform: translate(-50%, -50%) rotate(-10deg); }
.stamp.bone { width: 40px; height: 24px; }
.empty.cute { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; padding: 10px 0; }
.empty-cat { width: 56px; height: 40px; flex: none; }
.empty-cat svg { width: 100%; height: 100%; }
.mascot.m-work svg { animation: cat-bob 1.6s ease-in-out infinite; transform-origin: 50% 90%; }
.mascot.m-yay svg { animation: cat-hop 1.2s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes cat-bob { 50% { transform: rotate(-3deg); } }

<script>
'use strict';
const DAY_SHIFT_MS = 4 * 3600 * 1000;
const LATE_CLOCKOUT_MS = 2 * 3600 * 1000;
const PX_PER_MIN = 1.1;
const WEEKDAYS = '日一二三四五六';
const WD_MON = ['一', '二', '三', '四', '五', '六', '日'];
const SVGNS = 'http://www.w3.org/2000/svg';
const REPEAT_TYPES = ['daily', 'weekly', 'weekdays', 'any', 'once'];
const REPEAT_LABELS = { daily: '每天', weekly: '每周几次', weekdays: '固定每周几', any: '随时', once: '只做一次' };
const BLOCK_TYPES = ['work', 'meal', 'exercise', 'rest', 'other'];
const BLOCK_LABELS = { work: '工作', meal: '吃饭', exercise: '运动', rest: '休息', other: '其他' };
const RULE_FIELDS = [
  ['onTime', '准时奖', 0, 100], ['full', '做满到下班奖', 0, 100], ['missPer10', '迟到早退每 10 分钟扣', 0, 100], ['missCap', '每段最多扣', 0, 500],
  ['absent', '整段缺勤扣', 0, 500], ['overtimePer10', '加班每满 10 分钟奖', 0, 100], ['overtimeCapMin', '加班每天最多算（分钟）', 0, 720], ['overtimeHalfAfterMin', '加班超过几分钟后减半（0 不减半）', 0, 720], ['remindBeforeMin', '上班前几分钟提醒', 0, 60],
];
const DEFAULT_CONFIG = {
  dailyGoal: 60,
  comebackWindowMin: 10,
  overrunPerMin: 1,
  overrunCapMin: 30,
  leaveFreeMin: 240,
  leavePerHour: 10,
  tasks: [
    { id: 'wake', kind: 'morning', name: '醒来第一件事', note: '在碰手机之前完成', fish: 15, repeat: { type: 'daily' } },
    { id: 'plan', name: '写下今天最重要的三件事', note: '写在纸上或备忘录里都行', fish: 5, repeat: { type: 'daily' } },
    { id: 'read', name: '读书 20 分钟', note: '电子书、纸书都算', fish: 10, repeat: { type: 'daily' } },
    { id: 'focus', name: '专注 25 分钟', note: '一个番茄钟，期间不看手机', fish: 10, multi: true, repeat: { type: 'any' } },
    { id: 'project', name: '个人项目推进一步', note: '写一段代码、画一张图、改一版文案，都算一步', fish: 15, multi: true, repeat: { type: 'any' } },
    { id: 'review', name: '周末复盘', note: '这周做成了什么，下周想做什么', fish: 30, repeat: { type: 'weekly', times: 1 } },
    { id: 'move', name: '运动 30 分钟', note: '跑步、跳操、下楼散步都算', fish: 15, cat: 'life', repeat: { type: 'daily' } },
    { id: 'tidy', name: '整理房间', note: '收拾桌面也算', fish: 10, cat: 'life', repeat: { type: 'weekly', times: 2 } },
    { id: 'comeback', kind: 'comeback', name: '休息后按时回来', note: '计时休息结束后 10 分钟内回来', fish: 5, repeat: { type: 'any' } },
  ],
  rewards: [
    { id: 'break5', name: '工作中途歇 5 分钟', price: 5, minutes: 5 },
    { id: 'video30', name: '刷 30 分钟短视频，不内疚', price: 60, minutes: 30 },
    { id: 'episode', name: '看一集剧', price: 80, minutes: 45 },
    { id: 'game60', name: '玩 1 小时游戏', price: 100, minutes: 60 },
    { id: 'milktea', name: '一杯奶茶', price: 80 },
    { id: 'takeout', name: '点一次喜欢的外卖', price: 120 },
    { id: 'sleepin', name: '周末睡个懒觉', price: 100, note: '周六或周日用' },
  ],
  levels: [{ name: '实习猫', min: 0 }, { name: '正式猫', min: 300 }, { name: '资深猫', min: 1000 }, { name: '猫组长', min: 2500 }, { name: '猫老板', min: 5000 }],
  morningSteps: ['拉开窗帘，喝一杯水', '吃一顿早餐', '列出今日的计划'],
  schedule: {
    days: [1, 2, 3, 4, 5],
    enabledAt: 0,
    blocks: [
      { id: 'b-am', name: '上午工作', start: '09:00', end: '12:00', type: 'work' },
      { id: 'b-lunch', name: '午饭', start: '12:00', end: '14:00', type: 'meal' },
      { id: 'b-pm', name: '下午工作', start: '14:00', end: '16:00', type: 'work' },
      { id: 'b-gym', name: '健身和下午茶', start: '16:00', end: '18:00', type: 'exercise' },
      { id: 'b-eve', name: '晚间工作', start: '18:00', end: '20:00', type: 'work' },
      { id: 'b-rest', name: '晚饭和休息', start: '20:00', end: '24:00', type: 'rest' },
    ],
  },
  attendance: { onTime: 10, full: 10, missPer10: 5, missCap: 20, absent: 30, overtimePer10: 2, overtimeCapMin: 240, overtimeHalfAfterMin: 120, remindBeforeMin: 5 },
};

// ---------- storage ----------
// Inside the Mac app, Swift injects window.__XYG_BOOT__ (the saved file) before this script and takes saves through
// the "xyg" message handler. Opened in a normal browser, the page falls back to localStorage.
const bridge = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.xyg ? window.webkit.messageHandlers.xyg : null;
function post(type, payload) {
  if (!bridge) return;
  try { bridge.postMessage({ type, payload }); } catch (e) { /* the app is shutting down */ }
}
const clone = (x) => JSON.parse(JSON.stringify(x));
function migrate(raw) {
  const d = raw && typeof raw === 'object' ? raw : {};
  d.days = d.days && typeof d.days === 'object' ? d.days : {};
  const cfg = d.config && typeof d.config === 'object' ? d.config : clone(DEFAULT_CONFIG);
  for (const k of Object.keys(DEFAULT_CONFIG)) if (cfg[k] === undefined) cfg[k] = clone(DEFAULT_CONFIG[k]);
  cfg.tasks = (Array.isArray(cfg.tasks) ? cfg.tasks : []).filter((t) => t && t.kind !== 'focus');
  cfg.attendance = Object.assign(clone(DEFAULT_CONFIG.attendance), cfg.attendance || {});
  cfg.schedule = Object.assign(clone(DEFAULT_CONFIG.schedule), cfg.schedule || {});
  if (!cfg.schedule.enabledAt) cfg.schedule.enabledAt = Math.floor(Date.now() / 1000) * 1000;
  d.config = cfg;
  d.version = 3;
  d.timer = d.timer || null;
  d.work = d.work || null;
  d.away = d.away || null;
  return d;
}
function loadData() {
  let raw = window.__XYG_BOOT__ || null;
  if (!raw && !bridge) { try { raw = JSON.parse(localStorage.getItem('xyg-data') || 'null'); } catch (e) { raw = null; } }
  return migrate(raw);
}
let data = loadData();
let savePending = false;
function save() {
  if (savePending) return;
  savePending = true;
  queueMicrotask(flush);
}
function flush() {
  savePending = false;
  const json = JSON.stringify(data);
  if (bridge) post('save', json);
  else { try { localStorage.setItem('xyg-data', json); } catch (e) { /* private window */ } }
}

// ---------- time ----------
const pad = (n) => String(n).padStart(2, '0');
function fmtKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function dayKeyOf(ts) { return fmtKey(new Date(ts - DAY_SHIFT_MS)); }
function keyToDate(key) { const p = key.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2], 12); }
function addDays(key, n) { const d = keyToDate(key); d.setDate(d.getDate() + n); return fmtKey(d); }
function isoWeekday(key) { return ((keyToDate(key).getDay() + 6) % 7) + 1; }
function weekStartOf(key) { return addDays(key, 1 - isoWeekday(key)); }
function fmtMD(key) { const d = keyToDate(key); return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日'; }
function tsOf(key, hm) { const [h, m] = hm.split(':').map(Number); const d = keyToDate(key); d.setHours(0, 0, 0, 0); return d.getTime() + (h * 60 + m) * 60000; }
function hhmm(ts) { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function hhmmss(ts) { const d = new Date(ts); return hhmm(ts) + ':' + pad(d.getSeconds()); }
function clockText(ms) { const s = Math.max(0, Math.floor(ms / 1000)); return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60); }
function mmss(ms) { const s = Math.ceil(Math.max(0, ms) / 1000); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); }
function durText(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  const hh = Math.floor(s / 3600);
  const mm = Math.floor((s % 3600) / 60);
  const ss = s % 60;
  if (hh) return hh + ' 小时' + (mm ? ' ' + mm + ' 分' : '');
  if (mm) return mm + ' 分' + (ss ? ' ' + ss + ' 秒' : '');
  return ss + ' 秒';
}
function signed(n) { return (n >= 0 ? '+' : '−') + Math.abs(n); }
function newId(prefix) { return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function nowSec() { return Math.floor(Date.now() / 1000) * 1000; }
function validHM(s) {
  const m = /^(\d{1,2})[:：](\d{2})$/.exec(String(s || '').trim());
  if (!m) return null;
  const h = Number(m[1]);
  const mi = Number(m[2]);
  if (mi > 59 || h > 24 || (h === 24 && mi > 0)) return null;
  return pad(h) + ':' + pad(mi);
}
function hmToMin(hm) { const [h, m] = hm.split(':').map(Number); return h * 60 + m; }

// ---------- config ----------
const view = { tab: 'week', month: '', selected: '' };
const edit = { tasks: null, rewards: null, sched: null };
let lastDay = dayKeyOf(Date.now());
function cfg() { return data.config; }
function goal() { return Number(cfg().dailyGoal) || 60; }
function tasks() { return Array.isArray(cfg().tasks) ? cfg().tasks : []; }
function rewards() { return Array.isArray(cfg().rewards) ? cfg().rewards : []; }
function levels() {
  const l = Array.isArray(cfg().levels) ? cfg().levels.filter((x) => x && typeof x.min === 'number') : [];
  return l.length ? l.slice().sort((a, b) => a.min - b.min) : [{ name: '实习猫', min: 0 }];
}
function taskById(id) { return tasks().find((t) => t.id === id) || null; }
function taskByKind(kind) { return tasks().find((t) => t.kind === kind) || null; }
function overrunPerMin() { const v = Number(cfg().overrunPerMin); return Number.isFinite(v) && v >= 0 ? v : 1; }
function overrunCapMin() { return Number(cfg().overrunCapMin) || 30; }
// Whole minutes a break has run past its time, capped; the charge is that many minutes times the rate.
function overrunOf(t, now) {
  const end = t.startedAt + t.durationMs;
  const min = Math.max(0, Math.min(overrunCapMin(), Math.floor((now - end) / 60000)));
  return { min, fish: min * overrunPerMin(), end, capAt: end + overrunCapMin() * 60000 };
}
function comebackWindowMs() { return (Number(cfg().comebackWindowMin) || 10) * 60000; }
function selectedDay() { return view.selected && view.selected <= lastDay ? view.selected : lastDay; }

function repeatOf(t) {
  if (t.kind === 'morning') return { type: 'daily' };
  if (t.kind === 'comeback') return { type: 'any' };
  const r = t.repeat || {};
  if (r.type === 'weekly') return { type: 'weekly', times: Math.min(7, Math.max(1, Math.round(Number(r.times)) || 1)) };
  if (r.type === 'weekdays') {
    const days = (Array.isArray(r.days) ? r.days : []).map(Number).filter((d) => d >= 1 && d <= 7);
    return days.length ? { type: 'weekdays', days } : { type: 'daily' };
  }
  if (r.type === 'daily' || r.type === 'any' || r.type === 'once') return { type: r.type };
  return t.limit === 1 ? { type: 'daily' } : { type: 'any' };
}
function isMulti(t) { return t.kind === 'comeback' || (!!t.multi && repeatOf(t).type === 'any'); }
function repeatText(rep) {
  if (rep.type === 'daily') return '每天';
  if (rep.type === 'weekly') return '每周 ' + rep.times + ' 次';
  if (rep.type === 'weekdays') return '每周' + rep.days.slice().sort().map((d) => WD_MON[d - 1]).join('、');
  if (rep.type === 'once') return '只做一次';
  return '随时';
}

// ---------- days, events, sessions ----------
function dayDoc(key) {
  if (!data.days[key]) data.days[key] = {};
  const d = data.days[key];
  if (!d.events) d.events = {};
  if (!d.sessions) d.sessions = {};
  return d;
}
function isOff(key) { return !!(data.days[key] && data.days[key].off); }
// Leave: time ranges on a day (day.leaves). Each week the first leaveFreeMin minutes that fall on work blocks are free;
// past that, every hour costs leavePerHour fish (charged by the minute, rounded up), on the day that went over.
function leavesOf(key) {
  const d = data.days[key];
  const out = [];
  if (d && d.leaves) for (const id of Object.keys(d.leaves)) { const x = d.leaves[id]; if (x && x.s < x.e) out.push({ id, s: x.s, e: x.e }); }
  return out.sort((a, b) => a.s - b.s);

function computeTotals(now) {
  const t = { earned: 0, spent: 0, leaveFee: 0, attPos: 0, attNeg: 0, balance: 0, lifetime: 0, netByDay: {}, earnedByDay: {}, lifeByDay: {}, spentByDay: {}, leaveFeeByDay: {}, attByDay: {}, firstKey: null };

  for (let k = startKey; k <= lastDay; k = addDays(k, 1)) keys.add(k);
  for (const key of keys) {
    if (key > lastDay) continue;
    let earned = 0;
    let life = 0;
    let spent = 0;
    for (const e of eventsOf(data.days[key])) {
      const f = Number(e.fish) || 0;
      if (e.kind === 'spend') spent += f;

      else if (e.kind === 'earn') earned += f;

    const ws = weekStartOf(key);

    t.leaveFee += fee;
    t.leaveFeeByDay[key] = fee;
    // 生活奖励 goes into the balance and lifetime, but not into the day's 开工 score.
    t.earned += earned + life;
    t.spent += spent;
    t.attPos += sc.pos;
    t.attNeg += sc.neg;

    t.lifeByDay[key] = life;
    t.spentByDay[key] = spent;

// ---------- clocking in and out ----------

  else if (ctx.curCounts) msg += '，' + ctx.cur.name + '迟到 ' + durText(start - ctx.curStart);
  else if (ctx.next && ctx.next.s - start <= 3600000) msg += '，' + ctx.next.name + '准时';
  else msg += '，算加班';
  showToast(pre + msg, () => {
    if (data.work && data.work.id === id) {

  const d = data.days[dayKeyOf(w.start)];

  if (!x) return;
  const s = hmToTs(key, $('es-s').value);
  const e = hmToTs(key, $('es-e').value);
  const okS = s !== null && s >= Math.floor(x.start / 60000) * 60000;
  const okE = e !== null && e <= x.end;
  if (!okS || !okE || e <= s) { showToast('只能往里改：开始不早于 ' + hhmm(x.start) + '，结束不晚于 ' + hhmm(x.end) + '。'); return; }
  const old = Object.assign({}, x);
  d.sessions[id] = Object.assign({}, x, { start: Math.max(s, x.start), end: e, edited: true, by: 'user' });
  editSess = '';
  save();
  render();

let leaveDraft = null;

  const out = [];

let metSeen = null;
function renderToday(T) {
  const g = goal();

let chipsSig = '';

function renderClock() {
  const now = Date.now();

  const ctx = dayContext(now);
  const rules = rulesFor(ctx.key);
  const btn = $('wkBtn');
  const big = $('wkBig');
  big.classList.remove('is-late', 'is-working');

  let hint;
  if (w) {
    const plan = sessionPlan(w);

  const sc = scoreDay(ctx.key, now);
  const chips = sc.blocks.map((r) => blockChip(r, false)).filter(Boolean);
  if (sc.overtimeFish) chips.push(h('span', { class: 'wk-dot good', title: '加班 ' + durText(sc.overtimeMs) }, h('i'), '加班', h('b', { class: 'num', text: '+' + sc.overtimeFish })));

  if (edit.sched) return;

  const off = isOff(key);
  const dayStart = tsOf(key, '00:00');
  const toMin = (ts) => (ts - dayStart) / 60000;
  const blocks = blocksOf(key);
  const sess = sessionsOf(key, now);
  const evs = eventsOf(data.days[key]);
  const returns = {};
  evs.forEach((e) => { if (e.spendId) returns[e.spendId] = Math.max(returns[e.spendId] || 0, e.at); });
  const live = activeTimer();
  const plays = evs.filter((e) => e.kind === 'spend' && e.minutes)
    .map((e) => { const plan = e.at + e.minutes * 60000; const open = live && live.spendId === e.id; const end = open ? now : (returns[e.id] || plan); return { name: e.name, s: e.at, plan: Math.min(plan, end), e: end }; })
    .filter((x) => x.e > x.s);

  sess.forEach((x) => { span(toMin(x.s)); span(toMin(x.e)); });
  plays.forEach((x) => { span(toMin(x.s)); span(toMin(x.e)); });
  ticks.forEach((e) => span(toMin(e.at)));

    kids.push(el);
  }
  for (const l of (off ? [] : leavesOf(key))) {

    kids.push(h('div', { class: 'tl-plan tl-leave', title: '请假 ' + hhmm(l.s) + '–' + hhmm(l.e), style: 'top:' + (y(l.s) + 2) + 'px;height:' + height + 'px' }, h('span', { class: 'pn', text: '请假' }), height >= 38 ? h('span', { class: 'pt num', text: hhmm(l.s) + '–' + hhmm(l.e) }) : null));
  }

  for (const x of sess) {
    const height = Math.max(3, (x.e - x.s) / 60000 * PX_PER_MIN);
    const text = hhmm(x.s) + '–' + (x.open ? '现在' : hhmm(x.e));
    kids.push(h('div', { class: 'tl-bar ' + (x.open ? 'a-open' : 'a-work'), id: x.open ? 'tlOpen' : null, title: '实际工作 ' + text, style: 'top:' + y(x.s) + 'px;height:' + height + 'px' }));
  }

  const nowCat = h('span', { class: 'tl-cat', 'aria-hidden': 'true' });
  nowCat.innerHTML = '<svg viewBox="4 2 76 76"><path d="M14 34 L18 8 L34 24 Q42 22 50 24 L66 8 L70 34 Q76 48 70 60 Q58 74 42 74 Q26 74 14 60 Q8 48 14 34Z" fill="#fff" stroke="#3B2F2A" stroke-width="5" stroke-linejoin="round"/><circle cx="32" cy="46" r="4.5" fill="#3B2F2A"/><circle cx="52" cy="46" r="4.5" fill="#3B2F2A"/><path d="M39 54 h6 l-3 3z" fill="#F4A3B4"/></svg>';

  $('tlNext').disabled = key >= lastDay;

  $('tlBack').hidden = isToday ? tlAuto : false;
  if (tlShownDay !== key) {

  const now = Date.now();

  }
  const t0 = activeTimer();

  const t = activeTimer();
  if (t && now >= t.startedAt + t.durationMs && chimedFor !== t.id) {

    updateNowLine();

// Pointer-based drag (works the same in the Mac app's web view and in a browser).
// The gesture starts after a 6px move; onDrop gets the pointer position; a click right after a drag is swallowed.
function dragGesture(ev, src, hooks) {
  if (ev.button !== 0) return;
  const sx = ev.clientX;
  const sy = ev.clientY;
  const r = src.getBoundingClientRect();
  let ghost = null;
  const move = (e) => {
    if (!ghost) {
      if (Math.hypot(e.clientX - sx, e.clientY - sy) < 6) return;
      ghost = src.cloneNode(true);
      ghost.classList.add('drag-ghost');
      ghost.removeAttribute('id');
      ghost.querySelectorAll('[id]').forEach((n) => n.removeAttribute('id'));
      ghost.style.width = r.width + 'px';
      document.body.append(ghost);
      src.classList.add('is-dragging');
      document.body.classList.add('dragging');
    }
    e.preventDefault();
    ghost.style.left = r.left + e.clientX - sx + 'px';
    ghost.style.top = r.top + e.clientY - sy + 'px';
    if (e.clientY < 60) window.scrollBy(0, -14); else if (e.clientY > window.innerHeight - 60) window.scrollBy(0, 14);
    if (hooks.onMove) hooks.onMove(e.clientX, e.clientY);
  };
  const cleanup = () => {
    removeEventListener('pointermove', move);
    removeEventListener('pointerup', up);
    removeEventListener('pointercancel', cancel);
    if (ghost) ghost.remove();
    src.classList.remove('is-dragging');
    document.body.classList.remove('dragging');
    if (hooks.onEnd) hooks.onEnd();
  };
  const up = (e) => {
    const dragged = !!ghost;
    cleanup();
    if (!dragged) return;
    const swallow = (c) => { c.stopPropagation(); c.preventDefault(); };
    addEventListener('click', swallow, { capture: true, once: true });
    setTimeout(() => removeEventListener('click', swallow, { capture: true }), 0);
    hooks.onDrop(e.clientX, e.clientY);
  };
  const cancel = () => cleanup();
  addEventListener('pointermove', move);
  addEventListener('pointerup', up);
  addEventListener('pointercancel', cancel);
}

    ['加班', '工作时段以外的工作（包括连着干过午饭、晚饭），每满 10 分钟 +' + a.overtimePer10 + (Number(a.overtimeHalfAfterMin) ? '，超过 ' + durMin(a.overtimeHalfAfterMin * 60000) + '以后减半' : '') + '，每天最多算 ' + cap + '。'],
    ['请假', '每周有 ' + durMin(leaveFreeMs()) + '免费的假，不扣小鱼干；超出的部分每小时扣 ' + leavePerHour() + ' 条。请假的那段不算迟到、早退、缺勤。可以提前请这周剩下的日子，也可以补请今天已经过去、但没在工作的时间。请假中途回来点「开始工作」，假就到那时结束，没用完的退回额度。'],
    ['休息超时', '兑换的计时休息到点后没回来，每超 1 分钟扣 ' + overrunPerMin() + ' 条，最多扣 ' + overrunPerMin() * overrunCapMin() + ' 条；超过 ' + overrunCapMin() + ' 分钟自动结束。'],
  ];
  $('rulesPop').replaceChildren(
    h('ol', null, ...items.map(([k, v]) => h('li', null, h('b', { text: k + '：' }), v))),
    h('p', { class: 'muted small', text: '不排班的日子和请假的时间不计考勤。开始工作后会一直计时，跨时段连着干也不用重新打卡。电脑 30 分钟没动，就当你离开了，工作记到你最后一次动电脑的时候；2 小时内回来会接着计时，并问你离开那段算不算工作。以前「自动结束」的旧记录不给「做满」、不算加班，点「改」确认后正常算。分值可以在「编辑作息」里改。' }),
    h('p', { class: 'muted small', text: '每天攒够 ' + goal() + ' 条算开工，「连续开工天数」+1。只断一天不会中断；连着两天没达标，连续天数才从 0 重新算。小鱼干不会因此减少。生活奖励不算开工。凌晨 4 点前算前一天。' }));
}
makePopover('rulesBtn', 'rulesPop', renderRulesPop);
$('wkBtn').addEventListener('click', toggleWork);
$('leaveBtn').addEventListener('click', () => {
  const open = $('leavePanel').hidden;
  $('leavePanel').hidden = !open;
  $('leaveBtn').setAttribute('aria-expanded', String(open));
  if (open) { leaveDraft = null; renderLeavePanel(); }
});
$('leavePanel').addEventListener('click', onLeaveClick);
$('leavePanel').addEventListener('change', onLeaveChange);
$('wkStopBtn').addEventListener('click', () => {
  if (!data.work) return;
  $('wkStopForm').hidden = false;
  $('wkStopAt').value = hhmm(Date.now());
  $('wkStopAt').focus();
});
$('wkStopCancel').addEventListener('click', () => { $('wkStopForm').hidden = true; });
$('wkStopOk').addEventListener('click', stopAtChosen);
$('wkStopAt').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') stopAtChosen(); });
$('restBtn').addEventListener('click', () => { const msg = endBreak(); render(); showToast(msg); });
$('tlEditBtn').addEventListener('click', openSchedEditor);
$('tlPrev').addEventListener('click', () => selectDay(addDays(selectedDay(), -1)));
$('tlNext').addEventListener('click', () => selectDay(addDays(selectedDay(), 1)));
$('tlBack').addEventListener('click', () => { if (selectedDay() !== lastDay) selectDay(lastDay); else resumeFollow(); });
['wheel', 'touchstart', 'pointerdown', 'keydown'].forEach((type) => $('tlScroll').addEventListener(type, pauseFollow, { passive: true }));
$('monthPrev').addEventListener('click', () => shiftMonth(-1));
$('monthNext').addEventListener('click', () => shiftMonth(1));
$('backToday').addEventListener('click', () => { view.month = lastDay.slice(0, 7); selectDay(lastDay); });
$('toastUndo').addEventListener('click', () => { const u = toastUndo; hideToast(); if (u) u(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
window.addEventListener('pagehide', flush);

loadTab();
render();
pushReminders(true);
pushStatus(true);
setInterval(tick, 1000);
post('log', 'page ready, ' + Object.keys(data.days).length + ' day records');
</script>
</body>
</html>
